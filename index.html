<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ANC 計算機</title>
  <style>
    * { box-sizing: border-box; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #f4f6f8; margin: 0; padding: 20px; display: flex; justify-content: center; }
    .card { background: white; max-width: 440px; width: 100%; border-radius: 16px; padding: 24px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); }
    h2 { margin-top: 0; color: #1e293b; font-size: 1.4rem; text-align: center; }
    .input-group { margin-bottom: 16px; }
    label { display: block; font-size: 0.9rem; font-weight: 600; color: #475569; margin-bottom: 6px; }
    input[type="number"] { width: 100%; padding: 12px; border: 1px solid #cbd5e1; border-radius: 8px; font-size: 1rem; outline: none; }
    .result-box { margin-top: 24px; padding: 16px; border-radius: 12px; text-align: center; background: #f8fafc; border: 1px solid #e2e8f0; }
    .anc-value { font-size: 2.2rem; font-weight: 700; color: #0f172a; margin: 8px 0; }
    .status-badge { display: inline-block; padding: 6px 14px; border-radius: 20px; font-weight: 600; font-size: 0.9rem; }
    .normal { background: #dcfce7; color: #166534; }
    .mild { background: #fef9c3; color: #854d0e; }
    .moderate { background: #ffedd5; color: #9a3412; }
    .severe { background: #fee2e2; color: #991b1b; }
    .profound { background: #7f1d1d; color: #ffffff; }
  </style>
</head>
<body>
<div class="card">
  <h2>ANC 計算機</h2>
  <div class="input-group">
    <label for="wbc">WBC 白血球總數 (/µL)</label>
    <input type="number" id="wbc" value="4500" oninput="calculateANC()">
  </div>
  <div class="input-group">
    <label for="segs">Segmented Neutrophils (Segs %)</label>
    <input type="number" id="segs" value="50" oninput="calculateANC()">
  </div>
  <div class="input-group">
    <label for="bands">Band Neutrophils (Bands %)</label>
    <input type="number" id="bands" value="2" oninput="calculateANC()">
  </div>
  <div class="result-box">
    <div style="font-size: 0.85rem; color: #64748b;">Absolute Neutrophil Count</div>
    <div class="anc-value" id="anc-result">2,340 <span style="font-size: 1rem; font-weight: 400;">/µL</span></div>
    <div id="status-badge" class="status-badge normal">正常 (Normal)</div>
  </div>
</div>
<script>
function calculateANC() {
  const wbc = parseFloat(document.getElementById('wbc').value) || 0;
  const segs = parseFloat(document.getElementById('segs').value) || 0;
  const bands = parseFloat(document.getElementById('bands').value) || 0;
  const anc = Math.round(wbc * ((segs + bands) / 100));
  document.getElementById('anc-result').innerHTML = `${anc.toLocaleString()} <span style="font-size: 1rem; font-weight: 400;">/µL</span>`;
  const badge = document.getElementById('status-badge');
  badge.className = 'status-badge ';
  if (anc > 1500) { badge.innerText = '正常 (Normal)'; badge.classList.add('normal'); }
  else if (anc >= 1000) { badge.innerText = '輕度低下 (Mild)'; badge.classList.add('mild'); }
  else if (anc >= 500) { badge.innerText = '中度低下 (Moderate)'; badge.classList.add('moderate'); }
  else if (anc >= 100) { badge.innerText = '重度低下 (Severe)'; badge.classList.add('severe'); }
  else { badge.innerText = '極重度低下 (Profound)'; badge.classList.add('profound'); }
}
</script>
</body>
</html>
